name: Daily analytics (free, official APIs)

on:
  schedule:
    - cron: "17 2 * * *"   # 07:47 IST, before the 08:13 IST huddle
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Pull analytics
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_AMM: ${{ secrets.YT_REFRESH_TOKEN_AMM }}
          YT_REFRESH_TOKEN_YUGYOGII: ${{ secrets.YT_REFRESH_TOKEN_YUGYOGII }}
          META_PAGE_TOKEN_MIRA: ${{ secrets.META_PAGE_TOKEN_MIRA }}
          META_PAGE_TOKEN_YUGYOGI: ${{ secrets.META_PAGE_TOKEN_YUGYOGI }}
        run: python tools/analytics/pull.py
      - name: Commit results
        run: |
          git config user.name "hanuman-analytics"
          git config user.email "actions@users.noreply.github.com"
          git add data/analytics
          git diff --cached --quiet || git commit -m "analytics: $(TZ=Asia/Kolkata date +%F)"
          git push
